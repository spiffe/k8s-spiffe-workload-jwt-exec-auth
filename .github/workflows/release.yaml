name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Build releases on the newest patch of the go.mod line, so a
          # released binary does not ship a standard library with known
          # vulnerabilities. Without check-latest the toolchain resolves to
          # exactly the go.mod version.
          go-version-file: go.mod
          check-latest: true
      - uses: ko-build/setup-ko@v0.10
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
